<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 青岚OS · 主图标（矢量源） · 单焦点眼睛 + 山岚意象 + 终端氛围 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="1" stop-color="#0f1a22"/>
    </linearGradient>
    <linearGradient id="mtNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="mtFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <!-- 圆角方底（应用图标形状） -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 远山岚（淡，氛围） -->
  <path d="M0,430 L80,340 L160,400 L240,320 L320,390 L400,330 L512,410 L512,512 L0,512 Z" fill="url(#mtFar)"/>
  <!-- 近山岚（主青色调，强焦点底座） -->
  <path d="M0,470 L120,340 L200,430 L300,300 L380,410 L470,360 L512,400 L512,512 L0,512 Z" fill="url(#mtNear)"/>
  <!-- 眼睛外圈（teal 描边，强烈焦点） -->
  <circle cx="256" cy="206" r="124" fill="#ecfeff"/>
  <circle cx="256" cy="206" r="124" fill="none" stroke="#2dd4bf" stroke-width="12"/>
  <!-- 瞳孔 -->
  <circle cx="256" cy="206" r="58" fill="#0a0e14"/>
  <!-- 瞳中青点（高亮 = "岚" 的灵识） -->
  <circle cx="256" cy="206" r="24" fill="#5eead4"/>
  <circle cx="256" cy="206" r="7" fill="#0a0e14"/>
  <!-- 眼睛高光（左上小白点，小尺寸辨识） -->
  <circle cx="226" cy="178" r="14" fill="#ffffff" opacity="0.92"/>
</svg>